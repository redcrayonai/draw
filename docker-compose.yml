# The whole local stack in containers, for trying it out without the nix shell:
#
#   docker compose up --build
#
#   canvas     http://localhost:5173
#   dashboard  http://localhost:5174
#   mcp        http://localhost:8788/mcp   (DEV_AUTH=1 unless sign-in is set)
#   database   ws://localhost:3000, database redcrayon-local
#
# Every service joins the spacetimedb container's network, so `localhost` means
# what it means in native dev: the module trusts http://localhost:8788/agent-id
# and the database fetches its keys there, and the dashboard reaches the import
# runner and Postgres on localhost. That is also why every published port sits
# on spacetimedb, and why the ports cannot move.
#
# With no settings, the canvas and dashboard run anonymously and every MCP
# caller is user_dev. Real sign-in is optional: put the variables the self-host
# quickstart lists (redcrayonai/draw, docs/src/content/docs/self-host/
# quickstart.md, "Real sign-in") in a .env file next to this one. The `setup` job
# (docker/setup.sh) publishes the module and seeds on every `up`; data lives in
# volumes until `docker compose down -v`. For hot reload, use scripts/dev.sh.

x-app: &app
  image: redcrayon-dev
  # built once by the spacetimedb service
  pull_policy: never
  network_mode: service:spacetimedb

services:
  spacetimedb:
    build: { context: ., dockerfile: docker/Dockerfile }
    image: redcrayon-dev
    command: spacetime --root-dir /stdb start --listen-addr 0.0.0.0:3000 --non-interactive
    # Loopback only: DEV_AUTH makes every mcp caller user_dev, and the Host
    # header that passes its localhost check is the caller's to set.
    ports: ["127.0.0.1:3000:3000", "127.0.0.1:5173:5173", "127.0.0.1:5174:5174", "127.0.0.1:8788:8788"]
    volumes: [stdb:/stdb]
    healthcheck:
      test: curl -sf http://localhost:3000/v1/ping
      interval: 1s
      retries: 60

  postgres:
    image: postgres:17
    network_mode: service:spacetimedb
    environment:
      # shortcut: trust auth, as in scripts/pg.sh; Postgres is not published outside the stack's network
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes: [pg:/var/lib/postgresql/data]
    depends_on: [spacetimedb]

  setup:
    <<: *app
    command: docker/setup.sh
    environment:
      SPACETIME_DB: redcrayon-local
      # the module trusts browser tokens from this issuer, issued to this client
      BROWSER_ISSUER: ${VITE_OIDC_ISSUER:-}
      BROWSER_CLIENT_IDS: ${VITE_OIDC_CLIENT_ID:-}
    volumes:
      - state:/state
      # the CLI identity that owns the database; a new one could not republish
      - stdb-cli:/root/.config/spacetime
    depends_on:
      spacetimedb: { condition: service_healthy }
      postgres: { condition: service_started }

  mcp:
    <<: *app
    working_dir: /app/mcp
    command: /app/docker/mcp.sh
    environment:
      WRANGLER_SEND_METRICS: "false"
      MCP_API_KEYS: ${MCP_API_KEYS:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
    volumes: [state:/state:ro]
    depends_on:
      setup: { condition: service_completed_successfully }

  canvas:
    <<: *app
    working_dir: /app/client
    command: pnpm exec vite --host 0.0.0.0 --port 5173 --strictPort
    environment:
      VITE_SPACETIME_URI: ws://localhost:3000
      VITE_SPACETIME_DB: redcrayon-local
      VITE_MCP_URL: http://localhost:8788/mcp
      VITE_DASHBOARD_URL: http://localhost:5174
      VITE_AUTH_PROVIDER: &auth ${VITE_AUTH_PROVIDER:-anonymous}
      VITE_OIDC_ISSUER: &issuer ${VITE_OIDC_ISSUER:-}
      VITE_OIDC_CLIENT_ID: &client ${VITE_OIDC_CLIENT_ID:-}
    depends_on:
      setup: { condition: service_completed_successfully }

  dashboard:
    <<: *app
    working_dir: /app/web
    command: sh -c 'cp /state/web.env .env.local && exec pnpm exec vite dev --host 0.0.0.0'
    environment:
      VITE_MCP_URL: http://localhost:8788/mcp
      VITE_AUTH_PROVIDER: *auth
      VITE_OIDC_ISSUER: *issuer
      VITE_OIDC_CLIENT_ID: *client
      # who may import: the browser's issuer (unset = no accounts)
      OIDC_ISSUER: *issuer
      # with no accounts, anyone may import: fine here, every port is bound to 127.0.0.1
      IMPORTS_ANONYMOUS: "1"
      IMPORT_RUNNER_URL: http://localhost:3101
      IMPORT_RUNNER_SECRET: &import-secret local-only
      IMPORT_CALLBACK_URL: &import-callback http://localhost:5174/api/imports/complete
      # Versions plugin (SELF_HOSTING.md): offered with the endpoint, bucket and region in .env.
      VERSIONS_S3_ENDPOINT: ${VERSIONS_S3_ENDPOINT:-}
      VERSIONS_S3_BUCKET: ${VERSIONS_S3_BUCKET:-}
      VERSIONS_S3_REGION: ${VERSIONS_S3_REGION:-}
      VERSIONS_S3_ACCESS_KEY_ID: ${VERSIONS_S3_ACCESS_KEY_ID:-}
      VERSIONS_S3_SECRET_ACCESS_KEY: ${VERSIONS_S3_SECRET_ACCESS_KEY:-}
    volumes: [state:/state:ro]
    depends_on:
      setup: { condition: service_completed_successfully }

  importer:
    build: importer
    network_mode: service:spacetimedb
    environment:
      PORT: "3101"
      # shortcut: fixed secret; the runner is reachable only inside the stack's network
      IMPORT_RUNNER_SECRET: *import-secret
      IMPORT_CALLBACK_URL: *import-callback
    depends_on: [spacetimedb]

volumes:
  stdb:
  stdb-cli:
  pg:
  state:
