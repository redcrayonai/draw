<!doctype html>
<html lang="en" data-theme="dark">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Draw · Local</title></head>
<body class="local-mode">
  <header id="local-header"><strong>Draw</strong><select id="boards" aria-label="Board"></select><button id="new-board">New board</button><span id="status" role="status">Connecting…</span></header>
  <main id="local-main">
    <section id="local-canvas" aria-label="Architecture board"><div id="local-tools"><button id="add-node">Add node</button><button id="add-edge">Connect selected</button><button id="fit">Fit</button><button id="undo">Undo</button><button id="redo">Redo</button></div><svg id="canvas" aria-label="Board canvas" tabindex="0"><g id="world"></g></svg></section>
    <aside id="local-panel"><h2>Inspector</h2><p>Select a node or connection. Shift-click to select two nodes.</p><form id="edit" hidden><label>Label<input name="label"></label><label>Description<textarea name="description"></textarea></label><div id="geometry"><label>X<input name="x" type="number"></label><label>Y<input name="y" type="number"></label><label>Width<input name="w" type="number" min="16"></label><label>Height<input name="h" type="number" min="16"></label></div><button>Save</button><button type="button" id="delete">Delete</button></form><h2>Review</h2><form id="note"><label>Note on selection<textarea name="text" required></textarea></label><button>Add note</button></form><div id="notes"></div></aside>
  </main>
  <script type="module" src="/src/local-main.ts"></script>
</body></html>
