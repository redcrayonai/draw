<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex, nofollow">
    <title>Chart · Draw</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='none' stroke='%23E5484D' stroke-width='1.3' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect width='16' height='16' rx='3.5' fill='%23000' stroke='none'/%3E%3Cpath d='M2.75 13.25V11l7.5-7.5 2.25 2.25-7.5 7.5Z'/%3E%3Cpath d='M10.25 3.5l1.5-1.5 2.25 2.25-1.5 1.5'/%3E%3Cpath d='M4.75 9l2.25 2.25'/%3E%3C/svg%3E" />
  </head>
  <body class="chart-embed">
    <article id="embed-card" aria-label="Live chart">
      <header class="embed-header">
        <div><h1 id="embed-title">Loading chart…</h1><p id="embed-subtitle"></p></div>
        <select id="viewer-theme" aria-label="Theme"><option value="auto">System</option><option value="light">Light</option><option value="dark">Dark</option></select>
      </header>
      <main id="embed-plot-host">
        <p id="embed-status" role="status">Connecting…</p>
        <svg id="embed-chart" role="img" aria-labelledby="embed-title embed-subtitle" hidden><g class="chart-plot"></g><g id="world" hidden></g></svg>
      </main>
      <footer class="embed-footer">
        <span id="embed-source"></span>
        <details id="embed-data" hidden><summary>View data</summary><div class="embed-data-scroll" tabindex="0" role="region" aria-label="Chart data"><table></table></div></details>
        <div id="embed-board-tools" hidden>
          <select id="embed-mode" aria-label="Playback"></select>
          <button id="embed-fit">Fit</button><button id="embed-zoom-in" aria-label="Zoom in">+</button><button id="embed-zoom-out" aria-label="Zoom out">−</button>
        </div>
        <div id="embed-playback" hidden>
          <button id="embed-play" hidden>Play</button>
          <button id="embed-pause" aria-pressed="false">Pause animations</button>
          <button id="embed-replay">Replay</button>
          <label id="embed-loop-label" hidden><input id="embed-loop" type="checkbox"> Loop</label>
          <span id="embed-progress" aria-live="off"></span>
        </div>
        <a id="embed-open" target="_blank" rel="noopener noreferrer" hidden>Open in Draw ↗</a>
      </footer>
    </article>
    <script type="module" src="/src/embed.ts"></script>
  </body>
</html>
