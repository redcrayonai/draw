name: Feedback or suggestion
description: Share feedback or suggest a change to Draw.
body:
  - type: input
    id: component
    attributes:
      label: Component
      placeholder: Canvas, Dashboard, MCP, or Agent
  - type: textarea
    id: problem
    attributes:
      label: Feedback or problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include an example and any alternatives that you considered.
