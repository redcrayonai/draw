# Dashboard tests, types, build and Worker bundle checks, reused by the complete
# CI gate. deploy.yml handles production deployment after module publication.
# This suite includes fresh bindings, disposable Postgres migrations and route
# tests, and a credential-free wrangler dry run. Public VITE_* values are build
# configuration; server values remain Worker runtime secrets.

name: build-web

on:
  workflow_call:

env:
  # Local defaults: these are check builds; the hosted build is the private deploy's.
  VITE_SPACETIME_URI: ${{ vars.VITE_SPACETIME_URI || 'ws://127.0.0.1:3000' }}
  VITE_SPACETIME_DB: ${{ vars.VITE_SPACETIME_DB || 'redcrayon-local' }}
  VITE_CANVAS_URL: ${{ vars.VITE_CANVAS_URL }}

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/redcrayon_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7

      - name: Require build-time config
        run: |
          fail=0
          # Production needs configured app links, so the deploy variables are
          # required on pushes only; PR builds work without them.
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if [ -z "$VITE_SPACETIME_URI" ]; then
              echo "::error::Repository variable VITE_SPACETIME_URI is not set (e.g. ws://127.0.0.1:3000)."
              fail=1
            fi
            if [ -z "$VITE_SPACETIME_DB" ]; then
              echo "::error::Repository variable VITE_SPACETIME_DB is not set (e.g. redcrayon)."
              fail=1
            fi
            if [ -z "$VITE_CANVAS_URL" ]; then
              echo "::error::Repository variable VITE_CANVAS_URL is not set (the deployed canvas origin; dashboard board links open it)."
              fail=1
            fi
          fi
          exit "$fail"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            shared/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      # Test, build and bundle before shared/ is installed: Cloudflare's build
      # installs web/ only, so $shared (../shared) must resolve its imports
      # from web/ (vite.config.ts resolve.dedupe).
      - name: Migrate the test database
        working-directory: web
        run: pnpm exec dbmate --wait --no-dump-schema up

      - name: Test
        working-directory: web
        run: pnpm test

      # The core's default: VITE_AUTH_PROVIDER unset is anonymous.
      - name: Build
        working-directory: web
        run: pnpm run build

      - name: Bundle the Worker (dry run)
        working-directory: web
        run: pnpm exec wrangler deploy --dry-run --outdir /tmp/worker-bundle

      # Type-checking ../shared needs its own types.
      - name: Install shared dependencies
        working-directory: shared
        run: pnpm install --frozen-lockfile

      - name: Type-check
        working-directory: web
        run: pnpm run check
