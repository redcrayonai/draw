# Bindings drift check.
#
# The client, agent, importer and web dashboard each import generated
# bindings that are COMMITTED at <pkg>/src/module_bindings. This job
# regenerates all four from module/ with the pinned CLI and fails if the
# working tree changes — a module change whose bindings were not regenerated
# and committed cannot reach main or deploy. Note `spacetime generate` never
# deletes files, so removed reducers/tables/views leave orphans behind: delete
# them by hand (the untracked/diff check only catches drift in files the CLI
# writes).
#
# ci.yml runs this once for each PR and release, before both app builds.
# deploy.yml requires the complete CI gate before calling deploy-env.yml.

name: bindings-check

on:
  workflow_call:

jobs:
  bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Not bindings, but this job runs on every PR: links leave the default ?db= out.
      - name: Links set ?db= only through setDb
        run: scripts/db-link-grep.sh

      - uses: ./.github/actions/spacetime

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: module/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: module/pnpm-lock.yaml

      - name: Install module dependencies
        working-directory: module
        run: pnpm install --frozen-lockfile

      - name: Regenerate bindings
        working-directory: module
        run: |
          for dir in client agent importer web; do
            spacetime generate --no-config --lang typescript \
              --module-path . --out-dir "../${dir}/src/module_bindings"
          done

      - name: Fail if committed bindings are stale
        run: |
          # The "generated using ... (commit ...)" header varies with how the
          # CLI binary itself was built (release tarball vs nix), so ignore
          # that one line; any real drift still fails.
          stale=0
          paths=(client/src/module_bindings agent/src/module_bindings importer/src/module_bindings web/src/module_bindings)
          untracked="$(git ls-files --others --exclude-standard "${paths[@]}")"
          if [ -n "$untracked" ]; then
            echo "New generated files are not committed:"
            echo "$untracked"
            stale=1
          fi
          if ! git diff --exit-code -I '^// This was generated using spacetimedb cli version' -- "${paths[@]}"; then
            stale=1
          fi
          if [ "$stale" -ne 0 ]; then
            echo "::error::generated bindings are stale. Run 'spacetime generate --no-config --lang typescript --module-path module --out-dir <pkg>/src/module_bindings' for client, agent, importer and web, and commit the result."
            exit 1
          fi
          echo "Bindings are up to date."
