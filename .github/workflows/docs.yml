# Build the docs, publish checked main builds, and keep internals out of pages. The self-host
# quickstart may name SpacetimeDB and its documented connection settings.

name: docs

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: docs/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: docs
        env:
          PUBLIC_ALGOLIA_APP_ID: ${{ vars.PUBLIC_ALGOLIA_APP_ID }}
          PUBLIC_ALGOLIA_SEARCH_API_KEY: ${{ vars.PUBLIC_ALGOLIA_SEARCH_API_KEY }}
          PUBLIC_ALGOLIA_INDEX_NAME: ${{ vars.PUBLIC_ALGOLIA_INDEX_NAME }}
        run: pnpm run build

      - name: Test docs configuration
        run: node --test docs/scripts/*.test.mjs

      - name: Check page vocabulary
        run: |
          pattern='spacetime|maincloud|bsatn|clockwork|\bstdb\b|\breducer|wasm|energy budget|SenderError|panic|clerk'
          if grep -rniE "$pattern" docs/src docs/astro.config.mjs |
            perl -pe 'if (m{^docs/src/content/docs/self-host/quickstart\.md:}) { s/\b(SpacetimeDB|VITE_SPACETIME_URI|VITE_SPACETIME_DB|SPACETIME_DB|SPACETIMEDB_URL|SPACETIMEDB_DB|SPACETIMEDB_SERVICE_TOKEN)\b/[documented database setting]/g; }' |
            grep -iE "$pattern"; then
            echo "::error::a page names an undocumented vendor or a server internal"
            exit 1
          fi

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
