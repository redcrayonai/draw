# The session flows and the code the hosted MCP server reuses (RC-547):
# agent/ (the flows), shared/ (the DB HTTP client and
# the capture protocol), mcp/ (the HTTP snapshot, the capture deps, and the
# bundle check: the flows pull in no node:fs, child_process or DB SDK) and
# helper/ (the local facts helper, RC-555).
#
# `parity` runs the parity fixture (agent/src/parity.ts) on an isolated local
# DB through the HTTP snapshot, with this machine's git and then on helper
# captures, whose rows must equal agent/src/parity.golden.json (spec Decision
# 18; frozen since the SDK path that wrote it was retired, RC-571). Then the
# mcp Worker's tools run against it through MCP clients of both protocol eras.

name: session-flows

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: agent/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            agent/pnpm-lock.yaml
            shared/pnpm-lock.yaml
            mcp/pnpm-lock.yaml
            helper/pnpm-lock.yaml

      # mcp/ and helper/ type-check and bundle agent/src and shared/, so all install first.
      - name: Install
        run: for p in agent shared mcp helper; do pnpm -C "$p" install --frozen-lockfile; done

      - name: Type-check
        run: for p in agent shared mcp helper; do pnpm -C "$p" run typecheck; done

      - name: Test (mcp includes the bundle check; helper builds and runs its bundle)
        run: for p in agent shared mcp helper; do pnpm -C "$p" test; done

      # The Worker as deployed: bundle hygiene, then no vendor word in the bundle,
      # tools/list, instructions, any failure text or the plugin tree (spec §12).
      - name: Build the mcp Worker, check its hygiene and scan it
        run: |
          pnpm -C helper run build
          pnpm -C mcp run surface
          scripts/vendor-scan.sh

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/spacetime

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: agent/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            module/pnpm-lock.yaml
            agent/pnpm-lock.yaml
            shared/pnpm-lock.yaml
            mcp/pnpm-lock.yaml
            helper/pnpm-lock.yaml

      - name: Install
        run: for p in module agent shared mcp helper; do pnpm -C "$p" install --frozen-lockfile; done

      - name: The HTTP path, on this machine and on captures, leaves the golden rows
        run: scripts/stdb-test.sh parity

      - name: The mcp Worker's tools on a real DB (both client eras)
        run: scripts/stdb-test.sh mcp
