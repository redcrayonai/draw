# Reusable module integration tests against isolated local SpacetimeDB.
# ci.yml runs this once for each PR and release; deploy.yml requires the
# complete CI gate before deploy-env.yml publishes the module.
#
# The suites cover access, dashboard, architecture, charts and issuers.
# Public wire compatibility is compared with main in the local variant.
# Local, staging and production run the integration suites; the committed
# none variant must refuse every sender (scripts/stdb-test.sh failclosed).
# Only staging and production refuse senders and budget writes (RC-571), so
# their runs are the ones that test both.

name: module-tests

on:
  workflow_call:

jobs:
  module:
    runs-on: ubuntu-latest
    # a hung server must not hold publish for the 6-hour default
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        variant: [local, staging, production, none]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/spacetime

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: module/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            module/pnpm-lock.yaml
            client/pnpm-lock.yaml
            shared/pnpm-lock.yaml

      # module/ is built and published; the suites talk to the server through
      # client/'s generated bindings and its SDK, and derive identities with shared/.
      - name: Install
        run: for p in module client shared; do pnpm -C "$p" install --frozen-lockfile; done

      - name: Preserve the public wire schema from main
        if: matrix.variant == 'local'
        run: scripts/check-module-upgrade.sh

      - name: The committed issuers are the none variant
        if: matrix.variant == 'none'
        run: |
          node scripts/module-env.mjs none
          git diff --exit-code -- module/src/issuers.ts || {
            echo "::error::module/src/issuers.ts is not what 'node scripts/module-env.mjs none' writes. Run it and commit the result."
            exit 1
          }

      - name: Access, dashboard, architecture, chart, issuer and mark suites (${{ matrix.variant }})
        if: matrix.variant != 'none'
        env:
          MODULE_ENV: ${{ matrix.variant }}
          # every suite runs under the storage limits where a deployment would turn them on
          REDCRAYON_LIMITS: ${{ matrix.variant == 'local' && 'off' || 'on' }}
        run: scripts/stdb-test.sh run scripts/verify-architecture-local.mjs scripts/verify-charts-local.mjs

      - name: The none variant refuses every sender
        if: matrix.variant == 'none'
        run: scripts/stdb-test.sh failclosed
