name: native-packages

on:
  workflow_call:
    inputs:
      version:
        type: string
        default: ''
      mcp-origin:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  native:
    name: native (${{ matrix.platform }}-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: linux, arch: x64 }
          - { runner: ubuntu-24.04-arm, platform: linux, arch: arm64 }
          - { runner: macos-15, platform: darwin, arch: arm64 }
          - { runner: macos-15-intel, platform: darwin, arch: x64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Stamp a release build
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
          PLUGIN_MCP_ORIGIN: ${{ inputs.mcp-origin }}
        run: |
          node scripts/release-labels.mjs stamp-plugin "$VERSION"
          node scripts/plugin-config.mjs "${PLUGIN_MCP_ORIGIN:?A release build needs its hosted MCP origin}"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: helper/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Install build and browser test dependencies
        run: for p in agent client helper e2e; do pnpm -C "$p" install --frozen-lockfile; done
      - name: Build standalone executable and npm packages
        run: pnpm -C helper build:binary
      - name: Install with npm and Bun and verify no runtime dependencies
        run: node scripts/local-binary-smoke.mjs helper/dist/binary/draw-*.tgz helper/dist/binary/redcrayonai-draw-*.tgz
      - name: Install Chromium
        run: pnpm -C e2e exec playwright install --with-deps chromium
      - name: Browser and MCP journey using only the relocated executable
        env:
          DRAW_LOCAL_BINARY: ${{ github.workspace }}/helper/dist/binary/draw
        run: pnpm -C e2e exec playwright test --config local.config.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: draw-native-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            helper/dist/binary/draw-*.tgz
            helper/dist/binary/redcrayonai-draw-*.tgz
            helper/dist/binary/SHA256SUMS
          if-no-files-found: error
