# Ship one version of the shared executable, its four platform packages, and
# the existing hosted plugin. Native packages publish before the canonical npm
# package; every executable is built and exercised on its target architecture.

name: release-plugin

on:
  push:
    tags: ['plugin-v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-plugin
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # release-labels.yml picks a tag's version from PR labels; the files still hold the last hand bump.
      # Without helper/ the next step names the problem.
      - name: Stamp the tag's version into the files that ship
        if: startsWith(github.ref, 'refs/tags/plugin-v') && hashFiles('helper/package.json') != ''
        run: node scripts/release-labels.mjs stamp-plugin "${GITHUB_REF_NAME#plugin-v}"

      - name: Check the helper and versions
        id: version
        run: |
          if [ ! -f helper/package.json ]; then
            echo "::error::helper/ is missing on this commit. The plugin ships the built helper as bin/redcrayon.mjs: tag a commit that has helper/."
            exit 1
          fi
          package=$(node -p "require('./plugin/package.json').version")
          # A tag names its version; a hand run on main publishes the version the files hold.
          case "$GITHUB_REF" in
            refs/tags/plugin-v*) tag="${GITHUB_REF_NAME#plugin-v}" ;;
            refs/heads/main) tag="$package" ;;
            *) echo "::error::release from main or a plugin-v<version> tag, not $GITHUB_REF."; exit 1 ;;
          esac
          plugin=$(node -p "require('./plugin/.claude-plugin/plugin.json').version")
          helper=$(node -p "require('./helper/package.json').version")
          if [ "$tag" != "$package" ] || [ "$tag" != "$plugin" ] || [ "$tag" != "$helper" ]; then
            echo "::error::tag plugin-v$tag, plugin/package.json $package, plugin/.claude-plugin/plugin.json $plugin and helper/package.json $helper must hold the same version."
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: Refuse a version already used by the older Node package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "@redcrayonai/draw@$VERSION" version >/dev/null 2>&1; then
            test "$(npm view "@redcrayonai/draw@$VERSION" drawRuntime.protocol)" = 1 || { echo 'This version predates the shared runtime; release a new version.' >&2; exit 1; }
          fi

      - name: Configure the release endpoint
        env:
          PLUGIN_MCP_ORIGIN: ${{ vars.PLUGIN_MCP_ORIGIN }}
        run: |
          node scripts/plugin-config.mjs "${PLUGIN_MCP_ORIGIN:?Set PLUGIN_MCP_ORIGIN to the hosted MCP origin}"
          if grep -rn 'redcrayon\.invalid' plugin helper/src; then
            echo "::error::the placeholder domain is still in the files above after configuring PLUGIN_MCP_ORIGIN."
            exit 1
          fi

      - name: Require an explicit deployment URL
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { domainOf, hostedUrl } from './scripts/plugin-config.mjs';
          const origin = new URL(hostedUrl(JSON.parse(readFileSync('plugin/.mcp.json', 'utf8')))).origin;
          domainOf(origin);
          const helperOrigin = readFileSync('helper/src/capture.ts', 'utf8').match(/^export const DEFAULT_ORIGIN = (['"])([^'"]+)\1;$/m)?.[2];
          if (helperOrigin !== origin) throw new Error('helper DEFAULT_ORIGIN must match the plugin MCP origin; check the PLUGIN_MCP_ORIGIN configuration step');
          NODE

  native:
    needs: prepare
    uses: ./.github/workflows/native-packages.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      mcp-origin: ${{ vars.PLUGIN_MCP_ORIGIN }}

  release:
    needs: [prepare, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Restore the validated release version and endpoint
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PLUGIN_MCP_ORIGIN: ${{ vars.PLUGIN_MCP_ORIGIN }}
        run: |
          node scripts/release-labels.mjs stamp-plugin "$VERSION"
          node scripts/plugin-config.mjs "$PLUGIN_MCP_ORIGIN"
      - uses: actions/download-artifact@v8
        with:
          pattern: draw-native-*
          path: ${{ runner.temp }}/native
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: helper/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: helper/pnpm-lock.yaml

      - name: Build the helper into the plugin
        run: |
          pnpm -C helper install --frozen-lockfile
          pnpm -C helper run build
          test -f helper/dist/redcrayon.mjs || { echo "::error::the helper build wrote no helper/dist/redcrayon.mjs"; exit 1; }
          cp helper/dist/redcrayon.mjs plugin/bin/redcrayon.mjs
          test -f helper/dist/chat-hook.mjs || { echo "::error::the helper build wrote no helper/dist/chat-hook.mjs"; exit 1; }
          cp helper/dist/chat-hook.mjs plugin/bin/chat-hook.mjs
          mkdir -p plugin/pi
          cp helper/dist/pi-extension.mjs plugin/pi/extension.mjs
          rm -f plugin/bin/.gitkeep

      - name: Pack the plugin
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          (cd plugin && npm pack --pack-destination "$RUNNER_TEMP/pack")
          tar -xzf "$RUNNER_TEMP"/pack/*.tgz -C "$RUNNER_TEMP/pack"
          test -f "$RUNNER_TEMP/pack/package/bin/chat-hook.mjs" || { echo "::error::the packed plugin has no bin/chat-hook.mjs: every chat hook would fail"; exit 1; }
          test -x "$RUNNER_TEMP/pack/package/bin/redcrayon.mjs" || { echo "::error::the packed plugin has no executable bin/redcrayon.mjs"; exit 1; }

      # The npm package and the marketplace file, with the text rules (vendor and internals words).
      - name: Vendor scan
        env:
          PLUGIN_RELEASE_SCAN: '1'
        run: |
          printf 'tree %s\ntree .claude-plugin\n' "$RUNNER_TEMP/pack/package" > "$RUNNER_TEMP/release.targets"
          scripts/vendor-scan.sh "$RUNNER_TEMP/release.targets" --hosted-plugin
          node --test scripts/plugin.test.mjs

      - name: Publish native packages first
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          npm install -g npm@^11.5.1
          case "$VERSION" in *-*) channel=next ;; *) channel=latest ;; esac
          for platform in darwin linux; do
            for arch in arm64 x64; do
              archive="$RUNNER_TEMP/native/draw-native-$platform-$arch/draw-$platform-$arch.tgz"
              package="@redcrayonai/draw-$platform-$arch"
              test -f "$archive"
              tar -xOf "$archive" package/package.json | node --input-type=module -e '
                let input = ""; for await (const chunk of process.stdin) input += chunk;
                const p = JSON.parse(input);
                if (p.name !== process.argv[1] || p.version !== process.env.VERSION) throw Error("Native package identity/version mismatch");
              ' "$package"
              if npm view "$package@$VERSION" version >/dev/null 2>&1; then
                echo "$package@$VERSION is already on npm; skipping the publish."
              else
                npm publish "$archive" --provenance --access public --tag "$channel"
              fi
            done
          done

      - name: Publish @redcrayonai/draw to npm (trusted publishing, provenance)
        working-directory: plugin
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          case "$VERSION" in *-*) channel=next ;; *) channel=latest ;; esac
          if npm view "@redcrayonai/draw@$VERSION" version >/dev/null 2>&1; then
            test "$(npm view "@redcrayonai/draw@$VERSION" drawRuntime.protocol)" = 1 || { echo 'This version predates the shared runtime; release a new version.' >&2; exit 1; }
            echo "@redcrayonai/draw@$VERSION is already on npm; skipping the publish."
          else
            npm publish --provenance --access public --tag "$channel"
          fi

      - name: Attach standalone archives and checksums to the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/standalone"
          cp "$RUNNER_TEMP"/native/draw-native-*/draw-*.tgz "$RUNNER_TEMP/standalone/"
          (cd "$RUNNER_TEMP/standalone" && sha256sum draw-*.tgz > SHA256SUMS)
          case "$VERSION" in *-*) prerelease=true; latest=false ;; *) prerelease=false; latest=true ;; esac
          gh release view "plugin-v$VERSION" >/dev/null 2>&1 || gh release create "plugin-v$VERSION" --target "$GITHUB_SHA" --title "Draw $VERSION" --generate-notes --prerelease="$prerelease" --latest="$latest"
          gh release upload "plugin-v$VERSION" "$RUNNER_TEMP"/standalone/* --clobber
