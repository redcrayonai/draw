# Secret hygiene (spec §12): gitleaks over the whole history, plus a grep for
# Identity-provider secret keys and private JWK material in the tree
# (scripts/secret-grep.sh). Called once by ci.yml for PRs and releases;
# deploy.yml requires that complete gate before production deployment.
#
# gitleaks runs as its pinned release binary, not gitleaks/gitleaks-action:
# the action needs a GITLEAKS_LICENSE secret on organization repositories.
# .gitleaks.toml extends the default rules with the tests' fake secrets.

name: secret-scan

on:
  workflow_call:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: '8.30.1'
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }} (pinned, checksum verified)
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks

      # --log-opts=--all: every fetched ref (branches and tags), not only HEAD's history.
      - name: gitleaks (every commit)
        run: /tmp/gitleaks git --no-banner --redact --config .gitleaks.toml --log-opts=--all .

      - name: Identity-provider secret keys and private JWKs
        run: scripts/secret-grep.sh
