# The self-host images and compose.prod.yml, from source (RC-608): builds the
# images, then runs the entrypoint tests, the vendor scan over each image's
# files and docker/prod/smoke/smoke.sh (refusals, TLS, an agent drawing with an
# MCP_API_KEYS key, data surviving down/up). Its own workflow, apart from ci.yml.

name: compose-prod-smoke

on:
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-prod-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the images
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: docker/prod/docker-bake.hcl
          load: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      - name: Entrypoint and rate-limit tests
        run: |
          sh docker/prod/scripts.test.sh
          node docker/prod/ratelimit.test.mjs

      - name: Vendor scan over the images
        run: docker/prod/scan-images.sh dev

      - name: Smoke
        env:
          SMOKE_LOGS: ${{ runner.temp }}/compose-prod.log
        run: docker/prod/smoke/smoke.sh

      - name: Stack logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-prod-logs
          path: ${{ runner.temp }}/compose-prod.log
