# Pushes the self-host images (RC-608) to GHCR for amd64 and arm64, on a tag
# v<version> only:
#
#   1. builds them for the runner and checks them: the entrypoint tests, the
#      vendor scan over each image's files, and the compose.prod.yml smoke;
#   2. pushes ghcr.io/redcrayonai/redcrayon-{canvas,dashboard,mcp,module-setup,importer}:<version>
#      for both platforms. The JavaScript builds run once, on the runner's
#      platform; arm64 only adds binaries and copies files (under QEMU).
#
# Packages pushed from a private repo start private: make each public once.

name: release-images

on:
  push:
    tags: ['v*']
  # release-labels.yml starts it on the v* tag a release:core PR gets
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-images
  cancel-in-progress: false

jobs:
  images:
    # a hand run on a branch would push images tagged with its name
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image tag
        run: echo "TAG=${TAG#v}" >> "$GITHUB_ENV"

      - name: Build for the runner
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: docker/prod/docker-bake.hcl
          load: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      - name: Check the images
        run: |
          sh docker/prod/scripts.test.sh
          node docker/prod/ratelimit.test.mjs
          docker/prod/scan-images.sh "$TAG"
          docker/prod/smoke/smoke.sh

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push amd64 + arm64
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: docker/prod/docker-bake.hcl
          push: true
          set: |
            *.platform=linux/amd64,linux/arm64
            *.cache-from=type=gha
