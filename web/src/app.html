<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Draw by Red Crayon</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg viewBox='0 0 32 32' xmlns='http%3A//www.w3.org/2000/svg'%3E%3Cg transform='matrix(.80901699 .58778525 -.58778525 .80901699 12.460292 -6.348836)'%3E%3Cpath d='m12 10 3.2-6.8q.8-1.5 1.6 0l3.2 6.8v17.5q0 1.5-1.5 1.5h-5q-1.5 0-1.5-1.5z' fill='%23f34b44'/%3E%3Cg fill='%2319191c'%3E%3Cpath d='m12 11.5h8v2h-8z'/%3E%3Cpath d='m12 24h8v2h-8z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Dark first, as on the canvas: only a stored dashboard theme replaces it.
      // The ids of $lib/theme THEMES; theme.test.ts holds them in step.
      // Best-effort: localStorage can throw in privacy-restricted contexts.
      var stored = null;
      try { stored = localStorage.getItem('redcrayon-theme'); } catch (e) {}
      document.documentElement.dataset.theme = [
        'dark', 'light', 'catppuccin-mocha', 'gruvbox-material', 'material-dark', 'monokai-pro', 'nord',
        'oceanic-next', 'one-dark', 'catppuccin-latte', 'material-light', 'one-light'
      ].indexOf(stored) >= 0 ? stored : 'dark';
    </script>
    %sveltekit.head%
  </head>
  <body>
    <div id="auth-gate" hidden><div id="auth-card"></div></div>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
