<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Draw by Red Crayon</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='none' stroke='%23E5484D' stroke-width='1.3' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect width='16' height='16' rx='3.5' fill='%23000' stroke='none'/%3E%3Cpath d='M2.75 13.25V11l7.5-7.5 2.25 2.25-7.5 7.5Z'/%3E%3Cpath d='M10.25 3.5l1.5-1.5 2.25 2.25-1.5 1.5'/%3E%3Cpath d='M4.75 9l2.25 2.25'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Dark first, as on the canvas: only a stored dashboard theme replaces it.
      // The ids of $lib/theme THEMES; theme.test.ts holds them in step.
      // Best-effort: localStorage can throw in privacy-restricted contexts.
      var stored = null;
      try { stored = localStorage.getItem('redcrayon-theme'); } catch (e) {}
      document.documentElement.dataset.theme = [
        'dark', 'light', 'catppuccin-mocha', 'gruvbox-material', 'material-dark', 'monokai-pro', 'nord',
        'oceanic-next', 'one-dark', 'catppuccin-latte', 'material-light', 'one-light'
      ].indexOf(stored) >= 0 ? stored : 'dark';
    </script>
    %sveltekit.head%
  </head>
  <body>
    <div id="auth-gate" hidden><div id="auth-card"></div></div>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
