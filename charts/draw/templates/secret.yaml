{{- /* Generated secrets survive upgrades (lookup) and uninstall (keep): Postgres keeps its password. */ -}}
{{- $name := include "draw.name" . -}}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "draw.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  postgres-password: {{ include "draw.generated" (list .Values.secrets.postgresPassword $old "postgres-password") }}
  import-runner-secret: {{ include "draw.generated" (list .Values.secrets.importRunnerSecret $old "import-runner-secret") }}
  mcp-api-keys: {{ .Values.mcpApiKeys | b64enc | quote }}
  versions-access-key-id: {{ .Values.versions.accessKeyId | b64enc | quote }}
  versions-secret-access-key: {{ .Values.versions.secretAccessKey | b64enc | quote }}
